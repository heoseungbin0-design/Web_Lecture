    <script>
        let box = document.querySelector('#box');

        // 마우스올렸을때
        box.addEventListener('mouseover', function() {
            box.style.backgroundColor = 'skyblue';
            box.textContent = '마우스가 올라왔습니다.';
        });

        // 마우스가 벗어났을 때

            box.style.backgroundColor = 'lightgray';
            box.textContent = '마우스를 올려보세요!';
        });
